plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weupperu.weupnotes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.weupperu.weupnotes'
        minSdk 26
        targetSdk 34
        versionCode 111
        versionName '1.1.1'
        resConfigs 'es'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ''
            versionNameSuffix '-apk'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
