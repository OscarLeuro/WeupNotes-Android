name: Build Weup Rescue APK
on:
  push:
    branches: [weup-rescue-android]
    paths:
      - 'rescue/**'
      - '.github/workflows/weup-rescue-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run scanner and carving unit smoke tests
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes app/src/main/java/com/weupperu/rescate/InternalTraceScanner.java app/src/main/java/com/weupperu/rescate/SignatureCarver.java tests/InternalTraceScannerSmoke.java tests/SignatureCarverSmoke.java
          java -cp build/test-classes InternalTraceScannerSmoke
          java -cp build/test-classes SignatureCarverSmoke
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WeupRescue-APK
          path: rescue/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
